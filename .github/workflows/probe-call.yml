# SANDBOX ONLY: where do check runs from a workflow_call (as seo-autopilot.yml uses) land? On the caller's commit or on the
# pull request's head commit?
name: probe-call
on:
  workflow_dispatch:
    inputs:
      branch:
        type: string
        required: true
permissions:
  contents: read
jobs:
  check:
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/seo-check.yml
    with:
      ref: ${{ inputs.branch }}
      base: main
  where:
    needs: check
    if: always()
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
      statuses: read
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ inputs.branch }}
        run: |
          head=$(gh api "repos/$GH_REPO/commits/$BRANCH" --jq .sha)
          echo "run sha (caller): $GITHUB_SHA"; echo "branch head: $head"
          echo "check runs on caller sha:"; gh api "repos/$GH_REPO/commits/$GITHUB_SHA/check-runs" --jq '.check_runs[] | "\(.name) \(.conclusion)"'
          echo "check runs on branch head:"; gh api "repos/$GH_REPO/commits/$head/check-runs" --jq '.check_runs[] | "\(.name) \(.conclusion)"'
          echo "commit statuses on branch head:"; gh api "repos/$GH_REPO/commits/$head/status" --jq ".statuses[] | \"\(.context) \(.state)\""
