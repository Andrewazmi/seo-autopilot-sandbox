# seo-autopilot: the implementer. When you add the label "approved" to an issue labelled "seo-proposal" or "seo-topic",
# Claude researches the change from your saved Search Console data, edits your CONTENT FILES on a branch and opens a
# pull request. It never pushes to your main branch: merging the pull request is the second approval.
#
# One-time setup: install the Claude GitHub app on this repository and add the secret CLAUDE_CODE_OAUTH_TOKEN
# (from `claude setup-token`). Without them this workflow simply does not run.
#
# Safety design (please keep it):
#  - The agent may only edit the content paths listed in --allowedTools below (generated by `init` from your config).
#  - It is NOT allowed to run build or test commands: a build executes project code, and the agent reads text that came
#    from the public internet. The build runs instead in seo-check.yml, a separate workflow with no secrets and read-only
#    permissions, on the pull request it opens.
#  - Issue text is treated as data, never as instructions.
#  - The third-party action is pinned to a full commit SHA. Update it deliberately (Dependabot can do it).
name: seo-implement
on:
  issues:
    types: [labeled]
  # Called by the scheduled seo-autopilot workflow for an issue the autopilot policy allows (no label needed).
  workflow_call:
    inputs:
      issue:
        type: number
        required: true
      # The autopilot runs seo-check and seo-review itself, in order, before its merge step.
      start_checks:
        type: boolean
        required: false
        default: true
  # Started by the daily portal step for an issue someone approved in the client portal (a label added by the workflow
  # token starts nothing by itself). Only agency members signed in to the portal can approve.
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to draft"
        type: number
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write   # required by claude-code-action for its GitHub app token exchange

concurrency:
  group: seo-implement-${{ inputs.issue || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: >-
      vars.SEO_AUTOPILOT_PAUSED != 'true' && (inputs.issue > 0 || (
      github.event.label.name == 'approved' &&
      (contains(github.event.issue.labels.*.name, 'seo-proposal') || contains(github.event.issue.labels.*.name, 'seo-topic') || contains(github.event.issue.labels.*.name, 'seo-work-order'))))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEO: "https://codeload.github.com/Grovlix/seo-autopilot/tar.gz/932689c9f3f7383803b0de0246197ce674bd0776"
    steps:
      # Anyone who can label issues could otherwise start the agent: only people with write access may approve.
      - name: Check that the person who approved has write access
        if: ${{ !inputs.issue }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.event.sender.login }}
        run: |
          perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission || echo none)
          case "$perm" in admin|maintain|write) echo "Approved by $ACTOR ($perm).";; *) echo "::error::$ACTOR ($perm) cannot approve changes; ignoring the label."; exit 1;; esac
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Load the latest saved SEO data (reports only)
        run: npx --yes "$SEO" state restore
      # SANDBOX ONLY: stands in for the claude-code-action drafter. Commits one file and opens a pull request with the
      # default workflow token, exactly as the model does, so we can see which workflows start.
      - name: Stub drafter (no model)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          N: ${{ inputs.issue || github.event.issue.number }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "seo/issue-$N"
          printf -- "---\ntitle: Stub page for issue %s\n---\n\nStub content written at %s.\n" "$N" "$(date -u +%FT%TZ)" > "content/stub-$N.md"
          git add "content/stub-$N.md"
          git commit -m "Stub draft for issue #$N"
          git push origin "seo/issue-$N"
          gh pr create --draft --head "seo/issue-$N" --title "Stub draft for issue #$N" --body "Sandbox stub draft. Closes #$N"
      # The autopilot policy decides by the kind of change, so the pull request carries the issue's kind (not the agent's choice).
      - name: Label the pull request with the kind of change
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          N: ${{ inputs.issue || github.event.issue.number }}
        run: |
          pr=$(gh pr list --head "seo/issue-$N" --state open --json number --jq '.[0].number // empty')
          [ -n "$pr" ] || exit 0
          for l in $(gh issue view "$N" --json labels --jq '.labels[].name'); do
            case "$l" in
              # D62: a hosted pull request must carry seo-hosted (the merge guard reads it): a failed copy fails the step.
              seo-hosted) gh pr edit "$pr" --add-label "$l";;
              seo-topic|seo-refresh|seo-snippet|seo-links|seo-fix|seo-template) gh pr edit "$pr" --add-label "$l" || true;;
            esac
          done

  # A pull request opened with the workflow token starts no pull_request workflows (GitHub now creates them as "action
  # required" runs that wait for a person to approve). A workflow_dispatch run is the documented exception, so seo-check and
  # seo-review are started here on the drafted branch. Each posts its result as a commit status ("seo-check", "seo-review")
  # on the pull request's head commit, where a person, branch protection and seo-automerge see it.
  # A separate job, so the drafting agent's token never holds actions: write.
  # format(): with no input (label or dispatch start) the value is null, and null == false in GitHub expressions.
  checks:
    needs: implement
    if: always() && needs.implement.result != 'skipped' && format('{0}', inputs.start_checks) != 'false'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Start the build check and the reviewer on the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          N: ${{ inputs.issue || github.event.issue.number }}
        run: |
          set -eu
          info=$(gh pr list --head "seo/issue-$N" --state open --json number,baseRefName --jq '.[0] // empty | "\(.number) \(.baseRefName)"')
          if [ -z "$info" ]; then echo "No open pull request for seo/issue-$N; nothing to check."; exit 0; fi
          pr=${info% *}; base=${info#* }
          gh workflow run seo-check.yml --ref "seo/issue-$N" -f ref="seo/issue-$N" -f base="$base" || echo "::warning::Could not start seo-check (is .github/workflows/seo-check.yml present?)."
          gh workflow run seo-review.yml --ref "seo/issue-$N" -f pr="$pr" || echo "::warning::Could not start seo-review (is .github/workflows/seo-review.yml present?)."
          echo "Started seo-check and seo-review on seo/issue-$N for pull request #$pr."
